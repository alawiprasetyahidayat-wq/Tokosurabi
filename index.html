<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Saya</title>
  <style>
    :root { --primary:#16865b; --dark:#17352a; --light:#f4f8f5; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; color:#24332b; background:var(--light); }
    header { background:var(--dark); color:white; padding:22px 5%; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    header h1 { margin:0; font-size:25px; }
    header p { margin:6px 0 0; color:#d7e8df; }
    .cart-button { background:white; color:var(--dark); border:0; border-radius:9px; padding:11px 16px; font-weight:bold; cursor:pointer; }
    main { max-width:1100px; margin:28px auto; padding:0 18px; }
    .intro { margin-bottom:22px; }
    .intro h2 { margin-bottom:6px; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:18px; }
    .card { background:white; border-radius:14px; padding:15px; box-shadow:0 3px 14px #163b2410; }
    .product-image { height:145px; border-radius:10px; background:#e6f1e9; display:grid; place-items:center; font-size:54px; }
    .card h3 { margin:13px 0 7px; }
    .price { color:var(--primary); font-size:19px; font-weight:bold; margin:8px 0 14px; }
    button { cursor:pointer; }
    .add { background:var(--primary); color:white; border:0; border-radius:8px; padding:11px 14px; width:100%; font-weight:bold; }
    .cart { background:white; border-radius:14px; padding:18px; margin-top:28px; box-shadow:0 3px 14px #163b2410; }
    .cart h2 { margin-top:0; }
    .cart-item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #e8eee9; }
    .qty { display:flex; align-items:center; gap:9px; }
    .qty button { border:1px solid #cbd8ce; background:white; border-radius:6px; width:28px; height:28px; }
    .remove { color:#b42318; border:0; background:none; }
    .total { display:flex; justify-content:space-between; font-size:19px; font-weight:bold; margin:18px 0; }
    .checkout { background:#20a85a; color:white; border:0; border-radius:9px; padding:14px; width:100%; font-size:16px; font-weight:bold; }
    .empty { color:#718078; }
    footer { text-align:center; padding:25px; color:#6c7c72; }
    @media(max-width:500px) { header h1{font-size:21px;} .cart-item{align-items:flex-start; flex-direction:column;} }
  </style>
</head>
<body>
  <header>
    <div><h1>Toko Online Saya</h1><p>Belanja mudah, pesan langsung lewat WhatsApp</p></div>
    <button class="cart-button" onclick="document.getElementById('keranjang').scrollIntoView({behavior:'smooth'})">🛒 Keranjang (<span id="cart-count">0</span>)</button>
  </header>

  <main>
    <section class="intro">
      <h2>Produk Kami</h2>
      <p>Pilih produk, masukkan ke keranjang, lalu kirim pesanan melalui WhatsApp.</p>
    </section>

    <section class="products" id="product-list"></section>

    <section class="cart" id="keranjang">
      <h2>🛒 Keranjang Belanja</h2>
      <div id="cart-items"><p class="empty">Keranjang masih kosong.</p></div>
      <div class="total"><span>Total</span><span id="cart-total">Rp0</span></div>
      <button class="checkout" onclick="checkoutWhatsApp()">Pesan via WhatsApp</button>
    </section>
  </main>
  <footer>Terima kasih sudah berbelanja di Toko Online Saya.</footer>

  <script>
    // Ganti nama, harga, emoji, dan deskripsi produk sesuai barang yang dijual.
    const products = [
      { id: 1, name: "Produk 1", description: "Deskripsi singkat produk pertama.", price: 25000, emoji: "🛍️" },
      { id: 2, name: "Produk 2", description: "Deskripsi singkat produk kedua.", price: 35000, emoji: "🎁" },
      { id: 3, name: "Produk 3", description: "Deskripsi singkat produk ketiga.", price: 50000, emoji: "✨" }
    ];
    // Format internasional Indonesia: 08... menjadi 628...
    const whatsappNumber = "6288901345038";
    const cart = {};

    const rupiah = value => new Intl.NumberFormat("id-ID", {
      style: "currency", currency: "IDR", maximumFractionDigits: 0
    }).format(value);

    function renderProducts() {
      document.getElementById("product-list").innerHTML = products.map(p => `
        <article class="card">
          <div class="product-image" aria-hidden="true">${p.emoji}</div>
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <div class="price">${rupiah(p.price)}</div>
          <button class="add" onclick="addToCart(${p.id})">+ Tambah ke Keranjang</button>
        </article>
      `).join("");
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    }

    function changeQty(id, amount) {
      cart[id] = (cart[id] || 0) + amount;
      if (cart[id] <= 0) delete cart[id];
      renderCart();
    }

    function removeItem(id) {
      delete cart[id];
      renderCart();
    }

    function renderCart() {
      const entries = Object.entries(cart);
      const count = entries.reduce((sum, [, qty]) => sum + qty, 0);
      const total = entries.reduce((sum, [id, qty]) => {
        const product = products.find(p => p.id === Number(id));
        return sum + product.price * qty;
      }, 0);

      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total").textContent = rupiah(total);
      document.getElementById("cart-items").innerHTML = entries.length ? entries.map(([id, qty]) => {
        const p = products.find(item => item.id === Number(id));
        return `<div class="cart-item">
          <div><strong>${p.name}</strong><br><small>${rupiah(p.price)} / item</small></div>
          <div class="qty">
            <button aria-label="Kurangi ${p.name}" onclick="changeQty(${p.id}, -1)">−</button>
            <strong>${qty}</strong>
            <button aria-label="Tambah ${p.name}" onclick="changeQty(${p.id}, 1)">+</button>
            <button class="remove" onclick="removeItem(${p.id})">Hapus</button>
          </div>
        </div>`;
      }).join("") : '<p class="empty">Keranjang masih kosong.</p>';
    }

    function checkoutWhatsApp() {
      const entries = Object.entries(cart);
      if (!entries.length) {
        alert("Keranjang masih kosong. Silakan pilih produk terlebih dahulu.");
        return;
      }
      let total = 0;
      const lines = entries.map(([id, qty]) => {
        const p = products.find(item => item.id === Number(id));
        const subtotal = p.price * qty;
        total += subtotal;
        return `- ${p.name} x${qty} = ${rupiah(subtotal)}`;
      });
      const message = [
        "Halo, saya ingin memesan:",
        "",
        ...lines,
        "",
        `Total: ${rupiah(total)}`,
        "",
        "Mohon info cara pembayaran dan pengirimannya. Terima kasih."
      ].join("\\n");
      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>
